name: Build ASALARY APK

on:
#  push:
#    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tao hoac dung khoa ky co dinh
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Them khoa ky co dinh"
            git push
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Luu cache Gradle va pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: build-cache-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            build-cache-${{ runner.os }}-

      - name: Tao khung du an Android
        run: flutter create --platforms=android --project-name theo_doi_luong app

      - name: Cau hinh Android (van tay, thong bao, desugaring)
        run: python3 android_setup.py

      - name: Chep ma nguon va font
        run: |
          mkdir -p app/assets/fonts
          rm -rf app/lib
          cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml
          cp LiberationSans-Regular.ttf LiberationSans-Bold.ttf app/assets/fonts/
          rm -f app/test/widget_test.dart

      - name: Tai package
        working-directory: app
        run: flutter pub get

      - name: Build ASALARY APK
        working-directory: app
        # Tên phiên bản (vd 1.1.0) lấy từ dòng `version:` trong pubspec.yaml, dùng cho cả Android lẫn trong app.
        # versionCode tính theo số phút từ năm 1970: luôn tăng và luôn lớn hơn bản đã cài từ repo hoặc workflow khác.
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//' | tr -d '[:space:]')
          echo "Phien ban: $VERSION"
          flutter build apk --release --no-shrink --target-platform android-arm64 \
            --build-name="$VERSION" --build-number=$(( $(date +%s) / 60 )) \
            --dart-define=APP_VERSION="$VERSION"

      - name: In chu ky va phien ban APK
        run: |
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs $APK | grep -E "SHA-256" || true
          $BT/aapt dump badging $APK | grep -E "package:" || true

      - uses: actions/upload-artifact@v4
        with:
          name: asalary-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
